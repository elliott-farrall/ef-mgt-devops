$schema: "http://json-schema.org/draft-07/schema#"
title: Organisation inputs (organisation.yaml)
description: Cross-platform organisation facts — who we operate as, where, and who pays.
type: object
additionalProperties: false
required:
  - organisation
properties:
  organisation:
    type: object
    additionalProperties: false
    required:
      - gcp
      - tfe
      - github
    properties:
      gcp:
        type: object
        additionalProperties: false
        required:
          - domain
          - region
          - billing
        properties:
          domain:
            type: string
            pattern: '^[a-z0-9.-]+\.[a-z]{2,}$'
            description: Domain the GCP organisation is registered under; resolved to its numeric ID by data.google_organization.
          region:
            type: string
            pattern: '^[a-z]+-[a-z0-9]+$'
            description: Default region for the google provider.
          billing:
            type: object
            additionalProperties: false
            required:
              - name
              - budgets
            properties:
              name:
                type: string
                minLength: 1
                description: Billing account display name; resolved to its ID by data.google_billing_account.
              budgets:
                type: array
                description: Budget alerts; GCP budgets notify, they never cap.
                minItems: 1
                items:
                  type: object
                  additionalProperties: false
                  required:
                    - name
                    - amount
                    - thresholds
                  properties:
                    name:
                      type: string
                      pattern: '^[a-z][a-z0-9-]*$'
                      description: Budget display name.
                    amount:
                      type: integer
                      minimum: 1
                      description: Monthly spend alert threshold in whole GBP.
                    thresholds:
                      type: array
                      minItems: 1
                      items:
                        type: number
                        exclusiveMinimum: 0
                        maximum: 1
                        description: Alert fractions of the amount, e.g. 0.5 = half spent.
                    scope:
                      type: string
                      pattern: '^(|projects/ef-[a-z0-9-]+|folders/ef-[a-z0-9-]+|organizations/[0-9]+)$'
                      description: Budget coverage; omit for the whole account.
      tfe:
        type: object
        additionalProperties: false
        required:
          - organisation
          - github_app_installation
        properties:
          organisation:
            type: string
            minLength: 1
            description: TFC organisation handle.
          github_app_installation:
            type: string
            minLength: 1
            description: Name of the prerequisite TFC GitHub App installation; resolved to its ID by data.tfe_github_app_installation.
          hostname:
            type: string
            default: "app.terraform.io"
            description: TFC API hostname; omit for the cloud.
      github:
        type: object
        additionalProperties: false
        required:
          - owner
        properties:
          owner:
            type: string
            minLength: 1
            description: GitHub account or organisation owning the repositories.
