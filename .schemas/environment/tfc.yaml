$schema: "http://json-schema.org/draft-07/schema#"
title: Terraform Cloud environment inputs (tfc.yaml)
description: Registry of TFC projects, each with the workspaces that belong to it.
type: object
additionalProperties: false
required:
  - tfc
properties:
  tfc:
    type: object
    additionalProperties: false
    required:
      - organisation
      - github_app_installation
      - projects
    properties:
      organisation:
        type: string
        description: TFC organisation handle.
      github_app_installation:
        type: string
        minLength: 1
        description: Name of the prerequisite TFC GitHub App installation; resolved to its ID by data.tfe_github_app_installation.
      hostname:
        type: string
        default: "app.terraform.io"
        description: TFC API hostname; omit for the cloud.
      projects:
        type: array
        description: Plane projects, mirroring the top-level GCP folders.
        minItems: 1
        items:
          $ref: "#/definitions/project"
definitions:
  project:
    type: object
    additionalProperties: false
    required:
      - name
    properties:
      name:
        type: string
        pattern: "^ef-[a-z0-9-]+$"
        description: Project name; lower kebab-case, ef- prefixed.
      workspaces:
        type: array
        description: Workspaces created in this project; one per ef-* repository.
        items:
          $ref: "#/definitions/workspace"
  workspace:
    type: object
    additionalProperties: false
    required:
      - name
      - environment
    properties:
      name:
        type: string
        pattern: "^ef-[a-z0-9-]+$"
        description: Workspace name; unique across the platform, e.g. ef-app-identity-dev.
      environment:
        type: string
        enum:
          - mgt
          - hub
          - dev
          - pre
          - prd
        description: Environment slot injected as the terraform "environment" variable.
      repo:
        type: string
        pattern: "^ef-[a-z0-9-]+$"
        description: GitHub repository this workspace builds; defaults to the workspace name (app workspaces share one repo across environments).
      working_directory:
        type: string
        default: "infrastructure"
        description: Terraform root inside the repository; omit for the standard layout.
      auto_apply:
        type: boolean
        default: false
        description: Run policy — true for dev-style planes, false where apply needs confirmation.
