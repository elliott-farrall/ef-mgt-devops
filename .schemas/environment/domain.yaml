$schema: "http://json-schema.org/draft-07/schema#"
title: Domain inputs (domain.yaml)
description: Public DNS zones and the platform-owned records in them.
type: object
additionalProperties: false
required:
  - domain
properties:
  domain:
    type: object
    additionalProperties: false
    required:
      - zones
    properties:
      zones:
        type: array
        description: Public DNS zones owned by the platform; workload repos manage their own records directly.
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required:
            - name
            - domain
            - project
          properties:
            name:
              type: string
              pattern: '^[a-z0-9-]+$'
              description: Managed zone resource name.
            domain:
              type: string
              pattern: '^[a-z0-9.-]+\.[a-z]{2,}$'
              description: DNS domain served by the zone.
            project:
              type: string
              pattern: '^ef-[a-z0-9-]+$'
              description: Hosting project; must exist in projects.yaml.
            records:
              type: array
              description: Platform-owned record sets; omit for none.
              items:
                type: object
                additionalProperties: false
                required:
                  - name
                  - type
                  - ttl
                  - records
                properties:
                  name:
                    type: string
                    pattern: '^[a-z0-9_*.-]+$'
                    description: Label relative to the zone, or the full apex name.
                  type:
                    enum:
                      - A
                      - AAAA
                      - CNAME
                      - MX
                      - NS
                      - TXT
                      - CAA
                      - SRV
                  ttl:
                    type: integer
                    minimum: 0
                  records:
                    type: array
                    minItems: 1
                    items:
                      type: string
