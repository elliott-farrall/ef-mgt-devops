$schema: "http://json-schema.org/draft-07/schema#"
title: Environment inputs (environments.yaml)
description: Deployment planes — a flat list of infrastructure environments. No parent hierarchy; each environment is top-level under the organization.
type: object
additionalProperties: false
required:
  - environments
properties:
  environments:
    type: array
    minItems: 1
    items:
      $ref: "#/definitions/environment"
definitions:
  environment:
    type: object
    additionalProperties: false
    required:
      - name
      - type
    properties:
      name:
        type: string
        pattern: '^[a-z][a-z0-9-]*$'
        description: Environment name; generates ef-<name> on first apply.
      type:
        enum:
          - infrastructure
        description: All types are infrastructure (folders removed).
      parent:
        type: string
        nullable: true
        description: Parent environment; omit for top-level environments (now all are top-level).
      projects:
        type: array
        description: Deliverables of this environment; each project mints resources according to its type.
        items:
          $ref: "#/definitions/project"
