---
$schema: "http://json-schema.org/draft-07/schema#"
title: Zone inputs (zones.yaml)
description: Cloud DNS managed zones and platform-owned record sets, hosted in the landing
  project.
type: object
additionalProperties: false
required:
  - zones
properties:
  zones:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          pattern: '^[a-z0-9.-]+\.[a-z]{2,}$'
          description: DNS domain of the zone; the managed zone name is generated by
            replacing dots
            with dashes.
        records:
          type: array
          description: Record sets owned by the platform.
          items:
            type: object
            additionalProperties: false
            required:
              - name
              - type
              - ttl
              - records
            properties:
              name:
                type: string
                description: Record name relative to the zone, or the zone domain for the
                  apex record.
              type:
                type: string
                enum:
                  - A
                  - AAAA
                  - CNAME
                  - MX
                  - NS
                  - TXT
                  - CAA
                  - SRV
                description: Record type.
              ttl:
                type: integer
                minimum: 1
                description: Record TTL in seconds.
              records:
                type: array
                description: Record values.
                minItems: 1
                items:
                  type: string
