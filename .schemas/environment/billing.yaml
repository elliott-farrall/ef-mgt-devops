$schema: "http://json-schema.org/draft-07/schema#"
title: Billing inputs (billing.yaml)
description: The billing relationship — account and budget alerts.
type: object
additionalProperties: false
required:
  - billing
properties:
  billing:
    type: object
    additionalProperties: false
    required:
      - billing_account_id
      - name
      - budgets
    properties:
      billing_account_id:
        type: string
        pattern: '^[0-9A-Z]{6}-[0-9A-Z]{6}-[0-9A-Z]{12}$'
        description: GCP billing account ID.
      name:
        type: string
        pattern: '^[a-z][a-z0-9-]*$'
        description: Billing account display suffix; Terraform prepends ef- (name billing selects the account displayed ef-billing).
      budgets:
        type: array
        description: Budget alerts; GCP budgets notify, they never cap.
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required:
            - name
            - amount
            - thresholds
          properties:
            name:
              type: string
              pattern: '^[a-z][a-z0-9-]*$'
              description: Budget display name.
            amount:
              type: integer
              minimum: 1
              description: Monthly spend alert threshold in whole GBP.
            thresholds:
              type: array
              minItems: 1
              items:
                type: number
                exclusiveMinimum: 0
                maximum: 1
                description: Alert fractions of the amount, e.g. 0.5 = half spent.
            scope:
              type: string
              pattern: '^(|projects/ef-[a-z0-9-]+|folders/ef-[a-z0-9-]+|organizations/[0-9]+)$'
              description: Budget coverage; omit for the whole account.
