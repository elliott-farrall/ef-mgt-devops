$schema: "http://json-schema.org/draft-07/schema#"
title: GCP environment inputs (gcp.yaml)
description: Registry of the GCP organisation structure for one environment slot.
type: object
additionalProperties: false
required:
  - gcp
properties:
  gcp:
    type: object
    additionalProperties: false
    required:
      - organisation
      - billing
      - region
      - folders
      - projects
      - iam
    properties:
      organisation:
        type: string
        pattern: '^[a-z0-9.-]+\.[a-z]{2,}$'
        description: Domain the GCP organisation is registered under; resolved to its numeric ID by data.google_organization.
      billing:
        type: object
        additionalProperties: false
        required:
          - name
          - currency
          - budgets
        properties:
          name:
            type: string
            minLength: 1
            description: Billing account display name; resolved to its ID by data.google_billing_account.
          currency:
            type: string
            pattern: '^[A-Z]{3}$'
            description: ISO 4217 currency for all budget amounts.
          budgets:
            type: array
            description: Budget alerts; GCP budgets notify, they never cap.
            minItems: 1
            items:
              type: object
              additionalProperties: false
              required:
                - name
                - amount
                - thresholds
              properties:
                name:
                  type: string
                  pattern: '^[a-z][a-z0-9-]*$'
                  description: Budget display name.
                amount:
                  type: integer
                  minimum: 1
                  description: Spend limit in whole currency units per calendar month.
                thresholds:
                  type: array
                  minItems: 1
                  items:
                    type: number
                    exclusiveMinimum: 0
                    maximum: 1
                    description: Alert fractions of the amount, e.g. 0.5 = half spent.
                projects:
                  type: array
                  description: Restrict the budget to named tree projects; omit for the whole account.
                  items:
                    type: string
                    pattern: '^ef-[a-z0-9-]+$'
      region:
        type: string
        description: Default region for the google provider.
      folders:
        type: array
        description: Flat folder registry; parent pointers carry the hierarchy.
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required:
            - name
            - parent
          properties:
            name:
              type: string
              pattern: "^ef-[a-z0-9-]+$"
            parent:
              type: string
              pattern: '^(root|ef-[a-z0-9-]+)$'
              description: root for children of the organisation root, otherwise another folder name.
      projects:
        type: array
        description: Flat project registry; each project names its parent folder.
        items:
          type: object
          additionalProperties: false
          required:
            - name
            - parent
          properties:
            name:
              type: string
              pattern: "^ef-[a-z0-9-]+$"
            parent:
              type: string
              pattern: "^ef-[a-z0-9-]+$"
      iam:
        type: array
        description: Platform identities and their IAM bindings, one entry per service account.
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required:
            - name
            - project
            - bindings
          properties:
            name:
              type: string
              pattern: "^sa-[a-z0-9-]+$"
            project:
              type: string
              pattern: "^ef-[a-z0-9-]+$"
              description: Hosting project; must be a project in gcp.projects.
            bindings:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                required:
                  - scope
                  - roles
                properties:
                  scope:
                    type: string
                    pattern: '^(folder:ef-[a-z0-9-]+|project:ef-[a-z0-9-]+|organisation|billing)$'
                    description: Binding target — a folder, a project, the organisation, or the billing account.
                  roles:
                    type: array
                    minItems: 1
                    items:
                      type: string
                      pattern: "^roles/[a-zA-Z.]+$"

