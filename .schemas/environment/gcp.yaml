$schema: "http://json-schema.org/draft-07/schema#"
title: GCP environment inputs (gcp.yaml)
description: Registry of the GCP organisation structure for one environment slot.
type: object
additionalProperties: false
required:
  - gcp
properties:
  gcp:
    type: object
    additionalProperties: false
    required:
      - organisation
      - billing
      - region
      - landing_project
      - folders
    properties:
      organisation:
        type: string
        pattern: '^[a-z0-9.-]+\.[a-z]{2,}$'
        description: Domain the GCP organisation is registered under; resolved to its numeric ID by data.google_organization.
      billing:
        type: string
        minLength: 1
        description: Billing account display name; resolved to its ID by data.google_billing_account.
      region:
        type: string
        description: Default region for the google provider.
      landing_project:
        type: string
        description: Project the google provider operates in; hosts every platform service account.
      folders:
        type: array
        description: The folder tree, rooted at ef-root; unrolled by locals and provisioned by modules/gcp-org.
        minItems: 1
        items:
          $ref: "#/definitions/folder"
      service_accounts:
        type: array
        description: Bindings at scopes the tree cannot imply — organisation and billing.
        items:
          type: object
          additionalProperties: false
          required:
            - name
            - scope
            - roles
          properties:
            name:
              type: string
              pattern: "^sa-[a-z0-9-]+$"
            scope:
              enum:
                - organisation
                - billing
            roles:
              type: array
              minItems: 1
              items:
                type: string
                pattern: "^roles/[a-zA-Z.]+$"
definitions:
  folder:
    type: object
    additionalProperties: false
    required:
      - name
    properties:
      name:
        type: string
        pattern: "^ef-[a-z0-9-]+$"
        description: Folder display name; lower kebab-case, ef- prefixed.
      projects:
        type: array
        description: Projects created directly under this folder (leaves).
        items:
          oneOf:
            - type: string
              pattern: "^ef-[a-z0-9-]+$"
            - type: object
              additionalProperties: false
              required:
                - name
              properties:
                name:
                  type: string
                  pattern: "^ef-[a-z0-9-]+$"
                service_accounts:
                  $ref: "#/definitions/folder/properties/service_accounts"
      folders:
        type: array
        description: Nested folders of the same shape.
        items:
          $ref: "#/definitions/folder"
      service_accounts:
        type: array
        description: Identities bound at this folder.
        items:
          type: object
          additionalProperties: false
          required:
            - name
            - roles
          properties:
            name:
              type: string
              pattern: "^sa-[a-z0-9-]+$"
            roles:
              type: array
              minItems: 1
              items:
                type: string
                pattern: "^roles/[a-zA-Z.]+$"
