$schema: "http://json-schema.org/draft-07/schema#"
title: Library inputs (libraries.yaml)
description: Repositories created without infrastructure — no environment, folder, workspace, service account, or GCP project. Entries of type module also publish to the TFC private registry.
type: object
additionalProperties: false
required:
  - libraries
properties:
  libraries:
    type: array
    minItems: 1
    items:
      $ref: "#/definitions/library"
definitions:
  library:
    type: object
    additionalProperties: false
    required:
      - name
      - type
    properties:
      name:
        type: string
        pattern: '^[a-z][a-z0-9-]*$'
        description: Library name; generates repository ef-lib-<name> on first apply.
      description:
        type: string
        description: Repository description; defaults to the repository name.
      type:
        enum:
          - module
          - software
        description: module publishes the repository to the TFC private registry; software creates the repository only.
      repo:
        type: string
        description: Repository name override; defaults to ef-lib-<name>.
