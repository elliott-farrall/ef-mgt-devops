---
name: Update flake lock

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-flake-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v14

      - uses: DeterminateSystems/update-flake-lock@v29
        with:
          commit-msg: "chore(flake): update nix inputs"
          pr-title: "chore(flake): update nix inputs"
          pr-labels: "dependencies"
