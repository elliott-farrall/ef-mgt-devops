name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    # fmt + validate only, no backend: GitHub Actions holds no cloud
    # credentials. The plan-only pass is enabled after bootstrap Step 5
    # wires the TFC workspace.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: fmt
        run: terraform fmt -check -recursive

      - name: validate
        run: |
          terraform init -backend=false
          terraform validate
