formatter: "markdown"

header-from: "main.tf"

recursive:
  enabled: true
  path: modules
  include-main: true

sections:
  hide: []
  show: []

sort:
  enabled: true
  by: name

output:
  file: "README.md"
  mode: replace

settings:
  anchor: true
  color: true
  default: true
  description: false
  escape: true
  hide-empty: false
  html: true
  indent: 2
  lockfile: true
  read-comments: true
  required: true
  sensitive: true
  type: true
