gcp:
  organisation: elliott-farrall.phd
  region: europe-west2

  billing:
    name: ef-billing
    budgets:
      - name: ef-budget-total
        amount: 30
        thresholds:
          - 0.5
          - 0.8
          - 1.0

  dns:
    zones:
      - name: elliott-farrall-phd
        domain: elliott-farrall.phd
        project: ef-mgt-devops
        records:
          - name: elliott-farrall.phd
            type: MX
            ttl: 300
            records:
              - 10 mail.protonmail.ch
              - 20 mailsec.protonmail.ch
          - name: elliott-farrall.phd
            type: TXT
            ttl: 300
            records:
              - v=spf1 include:_spf.protonmail.ch ~all
              - protonmail-verification=ea77d033a00e948f715ba9d296e7e1d273cd601d
          - name: _dmarc
            type: TXT
            ttl: 300
            records:
              - v=DMARC1; p=quarantine
          - name: protonmail._domainkey
            type: CNAME
            ttl: 300
            records:
              - protonmail.domainkey.dhfr5g7zlfrxnvkaaoev3xpmrbs6oc6foctcn3g3y3xgsfosafm7q.domains.proton.ch
          - name: protonmail2._domainkey
            type: CNAME
            ttl: 300
            records:
              - protonmail2.domainkey.dhfr5g7zlfrxnvkaaoev3xpmrbs6oc6foctcn3g3y3xgsfosafm7q.domains.proton.ch
          - name: protonmail3._domainkey
            type: CNAME
            ttl: 300
            records:
              - protonmail3.domainkey.dhfr5g7zlfrxnvkaaoev3xpmrbs6oc6foctcn3g3y3xgsfosafm7q.domains.proton.ch

  folders:
    - name: ef-root
      parent: root
    - name: ef-mgt
      parent: ef-root
    - name: ef-hub
      parent: ef-root
    - name: ef-app
      parent: ef-root
    - name: ef-dev
      parent: ef-app
    - name: ef-pre
      parent: ef-app
    - name: ef-prd
      parent: ef-app

  projects:
    - name: ef-mgt-devops
      parent: ef-mgt

  workload_identity:
    pool: ef-tfc
    pool_project: ef-mgt-devops
    providers:
      - name: tfc-mgt
        service_account: sa-adm-tfc
        attribute_condition: assertion.workspace_name == "ef-mgt-devops"
        subject: ef-mgt-devops
      - name: tfc-hub
        service_account: sa-hub-tfc
        attribute_condition: assertion.workspace_name == "ef-hub-network"
        subject: ef-hub-network
      - name: tfc-dev
        service_account: sa-dev-tfc
        attribute_condition: assertion.workspace_name.endsWith("-dev")
        subject: tfc-dev
      - name: tfc-pre
        service_account: sa-pre-tfc
        attribute_condition: assertion.workspace_name.endsWith("-pre")
        subject: tfc-pre
      - name: tfc-prd
        service_account: sa-prd-tfc
        attribute_condition: assertion.workspace_name.endsWith("-prd")
        subject: tfc-prd

  iam:
    - name: sa-adm-tfc
      project: ef-mgt-devops
      bindings:
        - scope: folder:ef-root
          roles:
            - roles/resourcemanager.folderAdmin
            - roles/resourcemanager.projectCreator
        - scope: project:ef-mgt-devops
          roles:
            - roles/iam.serviceAccountUser
            - roles/dns.admin
            - roles/dns.admin
            - roles/dns.admin
            - roles/dns.admin
        - scope: organisation
          roles:
            - roles/browser
        - scope: billing
          roles:
            - roles/billing.user
    - name: sa-mgt-tfc
      project: ef-mgt-devops
      bindings:
        - scope: folder:ef-mgt
          roles:
            - roles/resourcemanager.projectCreator
            - roles/editor
        - scope: project:ef-mgt-devops
          roles:
            - roles/iam.serviceAccountUser
            - roles/dns.admin
    - name: sa-hub-tfc
      project: ef-mgt-devops
      bindings:
        - scope: folder:ef-hub
          roles:
            - roles/resourcemanager.projectCreator
            - roles/editor
        - scope: project:ef-mgt-devops
          roles:
            - roles/iam.serviceAccountUser
    - name: sa-dev-tfc
      project: ef-mgt-devops
      bindings:
        - scope: folder:ef-dev
          roles:
            - roles/resourcemanager.projectCreator
            - roles/editor
        - scope: project:ef-mgt-devops
          roles:
            - roles/iam.serviceAccountUser
    - name: sa-pre-tfc
      project: ef-mgt-devops
      bindings:
        - scope: folder:ef-pre
          roles:
            - roles/resourcemanager.projectCreator
            - roles/editor
        - scope: project:ef-mgt-devops
          roles:
            - roles/iam.serviceAccountUser
    - name: sa-prd-tfc
      project: ef-mgt-devops
      bindings:
        - scope: folder:ef-prd
          roles:
            - roles/resourcemanager.projectCreator
            - roles/editor
        - scope: project:ef-mgt-devops
          roles:
            - roles/iam.serviceAccountUser
