gcp:
  organisation: elliott-farrall.phd
  region: europe-west2

  billing:
    name: ef-billing
    currency: GBP
    budgets:
      - name: ef-budget-total
        amount: 30
        thresholds:
          - 0.5
          - 0.8
          - 1.0

  folders:
    - name: ef-root
      folders:
        - name: ef-mgt
          projects:
            - ef-mgt-devops
        - name: ef-hub
        - name: ef-app
          folders:
            - name: ef-dev
            - name: ef-pre
            - name: ef-prd

  iam:
    - name: sa-adm-tfc
      project: ef-mgt-devops
      bindings:
        - scope: folder:ef-root
          roles:
            - roles/resourcemanager.folderAdmin
            - roles/resourcemanager.projectCreator
        - scope: project:ef-mgt-devops
          roles:
            - roles/iam.serviceAccountUser
        - scope: organisation
          roles:
            - roles/browser
        - scope: billing
          roles:
            - roles/billing.user
    - name: sa-mgt-tfc
      project: ef-mgt-devops
      bindings:
        - scope: folder:ef-mgt
          roles:
            - roles/resourcemanager.projectCreator
            - roles/editor
        - scope: project:ef-mgt-devops
          roles:
            - roles/iam.serviceAccountUser
    - name: sa-hub-tfc
      project: ef-mgt-devops
      bindings:
        - scope: folder:ef-hub
          roles:
            - roles/resourcemanager.projectCreator
            - roles/editor
        - scope: project:ef-mgt-devops
          roles:
            - roles/iam.serviceAccountUser
    - name: sa-dev-tfc
      project: ef-mgt-devops
      bindings:
        - scope: folder:ef-dev
          roles:
            - roles/resourcemanager.projectCreator
            - roles/editor
        - scope: project:ef-mgt-devops
          roles:
            - roles/iam.serviceAccountUser
    - name: sa-pre-tfc
      project: ef-mgt-devops
      bindings:
        - scope: folder:ef-pre
          roles:
            - roles/resourcemanager.projectCreator
            - roles/editor
        - scope: project:ef-mgt-devops
          roles:
            - roles/iam.serviceAccountUser
    - name: sa-prd-tfc
      project: ef-mgt-devops
      bindings:
        - scope: folder:ef-prd
          roles:
            - roles/resourcemanager.projectCreator
            - roles/editor
        - scope: project:ef-mgt-devops
          roles:
            - roles/iam.serviceAccountUser
