gcp:
  organisation: "elliott-farrall.phd"
  billing: "ef-billing"
  region: "europe-west2"
  landing_project: "ef-mgt-devops"

  folders:
    - name: ef-root
      service_accounts:
        - name: sa-adm-tfc
          roles:
            - roles/resourcemanager.folderAdmin
            - roles/resourcemanager.projectCreator
      folders:
        - name: ef-mgt
          service_accounts:
            - name: sa-mgt-tfc
              roles:
                - roles/resourcemanager.projectCreator
                - roles/editor
          projects:
            - name: ef-mgt-devops
              service_accounts:
                - name: sa-adm-tfc
                  roles:
                    - roles/iam.serviceAccountUser
                - name: sa-mgt-tfc
                  roles:
                    - roles/iam.serviceAccountUser
                - name: sa-hub-tfc
                  roles:
                    - roles/iam.serviceAccountUser
                - name: sa-dev-tfc
                  roles:
                    - roles/iam.serviceAccountUser
                - name: sa-pre-tfc
                  roles:
                    - roles/iam.serviceAccountUser
                - name: sa-prd-tfc
                  roles:
                    - roles/iam.serviceAccountUser
        - name: ef-hub
          service_accounts:
            - name: sa-hub-tfc
              roles:
                - roles/resourcemanager.projectCreator
                - roles/editor
        - name: ef-app
          folders:
            - name: ef-dev
              service_accounts:
                - name: sa-dev-tfc
                  roles:
                    - roles/resourcemanager.projectCreator
                    - roles/editor
            - name: ef-pre
              service_accounts:
                - name: sa-pre-tfc
                  roles:
                    - roles/resourcemanager.projectCreator
                    - roles/editor
            - name: ef-prd
              service_accounts:
                - name: sa-prd-tfc
                  roles:
                    - roles/resourcemanager.projectCreator
                    - roles/editor

  service_accounts:
    - name: sa-adm-tfc
      scope: organisation
      roles:
        - roles/browser
    - name: sa-adm-tfc
      scope: billing
      roles:
        - roles/billing.user
