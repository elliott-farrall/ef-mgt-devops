# yaml-language-server: $schema=../../.schemas/environment/environments.yaml
environments:
  - name: hub
    type: infrastructure

  - name: mgt
    type: infrastructure
    projects:
      - name: devops
        type: infrastructure
        description: DevOps Management.
        default: true
        services:
          - iam.googleapis.com
          - serviceusage.googleapis.com
          - cloudbilling.googleapis.com
          - dns.googleapis.com
          - compute.googleapis.com

  - name: dev
    type: infrastructure

  - name: pre
    type: infrastructure

  - name: prd
    type: infrastructure
