# yaml-language-server: $schema=../../.schemas/environment/environments.yaml
environments:
  - name: root
    type: blank

  - name: mgt
    type: terraform
    parent: root
    projects:
      - name: ef-mgt-devops
        type: infrastructure
        description: EF platform management plane - bootstrap scripts, platform IaC, runbook.
        default: true

  - name: hub
    type: terraform
    parent: root

  - name: app
    type: blank
    parent: root

  - name: dev
    type: terraform
    parent: app

  - name: pre
    type: terraform
    parent: app

  - name: prd
    type: terraform
    parent: app
