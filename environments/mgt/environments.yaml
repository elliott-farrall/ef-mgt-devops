# yaml-language-server: $schema=../../.schemas/environment/environments.yaml
environments:
  - name: root
    type: folder

  - name: mgt
    type: infrastructure
    parent: root
    projects:
      - name: devops
        type: infrastructure
        description: DevOps Management.
        default: true
        services:
          - iam.googleapis.com
          - serviceusage.googleapis.com
          - cloudbilling.googleapis.com
          - dns.googleapis.com
          - compute.googleapis.com

  - name: hub
    type: infrastructure
    parent: root

  - name: app
    type: folder
    parent: root

  - name: dev
    type: infrastructure
    parent: app

  - name: pre
    type: infrastructure
    parent: app

  - name: prd
    type: infrastructure
    parent: app

  - name: lib
    type: library
